name: 오늘의 볼거리 브리핑

on:
  schedule:
    - cron: "30 22 * * *"        # ① UTC 22:30 = KST 07:30 (전날 날짜가 된다)
  workflow_dispatch:             # ② 손으로도 돌릴 수 있게 — 없으면 고칠 수 없다
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

permissions:
  contents: write                # ⑥ 실행 기록을 저장소에 되커밋하려면 필요 (섹션 12)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # ③ 멈춰 있는 실행을 20분에서 끊는다

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성·발행
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '--send' }}
        env:                     # ④ 비밀값은 여기로만 들어간다
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KCISA_SERVICE_KEY:   ${{ secrets.KCISA_SERVICE_KEY }}
          TZ: Asia/Seoul

      - name: 기록 커밋        # ⑥ 임시 서버의 기록을 영구화한다 (섹션 12)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add store/
          git diff --cached --quiet || (git commit -m "metrics: $(date +%F)" && git push)

      - name: 실행 기록 보관    # ⑤ 실패한 회차의 기록이야말로 가장 보고 싶은 것
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: store/
          retention-days: 30
