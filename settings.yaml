# settings.yaml — 개발자가 고치는 임계값과 소스 목록.

hours:         168     # 7일. 문화 기사는 하루 물량이 적어 창을 넓힌다.
                       # 매일 이 7일을 다시 훑으므로, 이미 발행한 것을 빼는
                       # 실행 간 중복 차단(store/published.jsonl)이 반드시 함께 있어야 한다.
batch:          40
prelim_keep:     8
target:          5

# 검수(섹션 9)가 건수를 줄이므로 선별에서 여유분을 뽑고, 발행 직전에 다시 5건으로 확정한다.
# overselect 를 target 과 같게 두면 후처리가 사실상 꺼진다.
overselect:      8     # 실측 검수 탈락률 30~40% 를 메우는 여유분. 취재·검수 호출이 1.6배가 된다
max_per_source:  2     # 후보가 아니라 '발행분' 기준 매체 상한. per_source_max 와 거는 자리가 다르다

tier1_max:       0     # 이 분야에서 1차 소스(플랫폼·미술관 공식)는 곧 홍보물이다.
                       # 4강의 "면제는 경쟁 면제이지 검사 면제가 아니다" 가 강하게 적용된다.
per_source_max:  6     # 7일 창이라 한 소스가 쉽게 독차지한다. 24h 때보다 낮춘다
min_body:      450     # ArchDaily 585자 · 월간미술 452자. 국내 매거진은 본문이 짧아
                       # 해외 기준(600)을 그대로 쓰면 국내 소스가 먼저 떨어진다
model: "gpt-4o-mini"

# audience.yaml 토픽의 '묶음' 이름과 맞아야 한다.
#
# 쿼터는 '최소 보장' 이지 상한이 아니다. 한쪽이 모자란 날에는 남은 자리를
# 다른 쪽이 가져간다. 그러니 이 값은 '바라는 비율' 이 아니라
# '이만큼은 실제로 채울 수 있는 양' 으로 잡아야 한다.
#
# 문화 3 으로 두었을 때 실측(여유분 적용 후 10회): 회차 평균 문화 1.7 · 공간 2.9,
# 발행 누적 문화 17 · 공간 29 (37:63). 문화 쿼터 3 을 채운 것은 10회 중 2회뿐이다.
# 소스를 17곳으로 늘려도 비율은 그대로였다 — 중요도 기준 1·2번('지금 갈 수
# 있는가' '어디서 볼 수 있는지 적혀 있는가')을 전시 기사가 구조적으로 잘
# 만족하기 때문이다. 소스를 더 넣어서 풀리는 문제가 아니다.
#
# 그래서 실측 비율(2:3)에 맞춘다. 늘 미달로 남는 목표는 신호를 주지 못한다 —
# 매 회차 '문화 1/3' 이 찍히면 그게 이상한 날인지 보통 날인지 구분되지 않는다.
quota:
  문화: 2
  공간: 3

filters:
  # 경향 문화면은 연예·가요가 절반이라 선필터가 필수다.
  pick:
    - 영화
    - 드라마
    - 시리즈
    - OTT
    - 넷플릭스
    - 디즈니
    - 왓챠
    - 티빙
    - 쿠팡플레이
    - 애플TV
    - 다큐
    - 개봉
    - 상영
    - 독립영화
    - 책
    - 도서
    - 소설
    - 출판
    - 작가
    - 에세이
    - 전시
    - 미술관
    - 박물관
    - 갤러리
    - 비엔날레
    - 건축
    - 설치미술

sources:
  # ── 문화 (OTT·영화·책) ───────────────────────────────
  - {name: "WhatsOnNetflix", url: "https://www.whats-on-netflix.com/feed/"}
  - {name: "Decider",        url: "https://decider.com/feed/"}
  - {name: "IndieWire",      url: "https://www.indiewire.com/feed/"}
  - {name: "Guardian Books", url: "https://www.theguardian.com/books/rss"}
  - {name: "LitHub",         url: "https://lithub.com/feed/"}

  # ── 공간 (건축·전시·디자인) ───────────────────────────
  - {name: "ArchDaily",      url: "https://www.archdaily.com/rss/"}
  - {name: "Designboom",     url: "https://www.designboom.com/feed/"}
  - {name: "Colossal",       url: "https://www.thisiscolossal.com/feed/"}
  - {name: "Guardian Art",   url: "https://www.theguardian.com/artanddesign/rss"}
  - {name: "월간디자인",       url: "https://mdesign.designhouse.co.kr/rss"}

  # ── 국내 전문 매거진 ─────────────────────────────────
  # 둘 다 전문지라 노이즈가 없다 — 선필터를 걸지 않는다.
  # 공연은 '직접 가서 겪는 것' 이라 묶음상 공간에 속한다.
  - {name: "월간 객석",       url: "https://auditorium.kr/feed/"}
  # 책 전문지. 선필터를 걸면 제목에 '책·도서' 가 없는 정상 신간 소개
  # (『전쟁은 어떻게 정의를 훔쳤을까?』 등)가 떨어진다 — 실측 29건 중 11건.
  - {name: "독서신문",        url: "https://www.readersnews.com/rss/allArticle.xml"}

  # ── 국내 종합 — 연예 노이즈가 많아 선필터를 건다 ────────
  # 넷은 모두 종합 문화면이라 선필터 없이는 가요·연예·부고가 예선을 채운다.
  # 실측 통과율(7일 창): 경향 -18/50 · 동아 19/50 · 서울신문 9/26 · 오마이뉴스 7/20
  - {name: "경향 문화",       url: "https://www.khan.co.kr/rss/rssdata/culture_news.xml", match: "pick"}
  - {name: "동아 문화",       url: "https://rss.donga.com/culture.xml", match: "pick"}
  # seoul.co.kr 에는 문화 전용 RSS 가 없다(rss_culture.xml 404). 문화 기사는 '라이프' 에 실린다.
  - {name: "서울신문 라이프",   url: "https://www.seoul.co.kr/xml/rss/rss_life.xml", match: "pick"}
  # 시민기자 기반이라 '덜 알려진 것' 성향과 맞는다. 대신 물량이 적다.
  - {name: "오마이뉴스 문화",   url: "http://rss.ohmynews.com/rss/culture.xml", match: "pick"}

  # ── 사다리 1칸: 국내 전시 정보는 RSS 가 없어 공공 API 로 올라간다 ──
  # 키 발급: data.go.kr → "한국문화정보원 공연전시정보" 활용 신청 → KCISA_SERVICE_KEY
  # local_only — GitHub Actions 러너에서 이 주소에 닿지 못한다.
  # 실측: 로컬 0.9초 성공 / 러너 ConnectTimeout 30초 x 3회, 한 번은 403.
  #
  # '해외라서' 는 아니다. 추가 확인(2026-09-15):
  #   · apis.data.go.kr 은 AAAA 레코드가 없다 — IPv6 문제가 아니다
  #   · 단일 A 레코드 27.101.236.63 하나뿐이다
  #   · 국내가 아닌 다른 네트워크에서 부르면 HTTP 401 이 돌아온다 = 연결은 된다
  # 즉 전면 해외 차단이 아니라 GitHub 러너가 쓰는 대역(Azure)이 막히는 것으로 보인다.
  # data.go.kr 은 서비스별 IP 등록·차단을 두고 있고(UNREGISTERED_IP_ERROR 32 ·
  # BLACKLIST_IP_ACCESS_ERROR 29), 러너 IP 는 매번 바뀌어 등록으로는 풀 수 없다.
  #
  # 그래서 CI 에서는 건너뛰고 건너뛴 사실만 로그에 남긴다. 국내 고정 IP 에서
  # 실행하면(self-hosted runner 또는 국내 리전 VM) 그대로 들어온다.
  - name: "문화포털 전시"
    url:  "https://apis.data.go.kr/B553457/cultureinfo"   # period2 · detail2 를 부른다
    kind: "kcisa"
    local_only: true
    # 행사 DB 라 원재료가 '목록 레코드' 다 — 기간·장소는 있지만 비평이 없어
    # 요약이 안내문으로 나온다. 실측: 발행분의 27% 를 차지해 1위였다.
    # 후보 상한을 6 → 3 으로 낮춰 비평 매체가 본선에 올라올 자리를 만든다.
    # 빼지는 않는다. 국내 전시를 가진 유일한 소스이고, 그중 기획전은 맥락이 있다.
    max_items: 3

# ── 관문에서 탈락한 소스 — 다시 넣지 않도록 이유를 남긴다 (12강) ──
# Dezeen          : 7일 50건으로 물량 1위였으나 본문 추출 0자 (G1)
# RogerEbert      : 본문 추출 0자 (G1)
# NYT Books       : 본문 추출 0자 (G1)
# Criterion       : 본문 추출 0자 + 7일 내 1건 (G1·G2)
# 월간미술         : 7일 내 0건 — 발행이 뜸함 (G2). 본문 452자라 min_body 450 에서는
#                   G1 을 넘지만, 창 안에 기사가 없어 여전히 못 쓴다
# 한겨레 문화면     : 30건인데 7일 내 0건, 날짜 표기 이상 (G2)
# 브리크 매거진     : 7일 내 0건, 발행이 뜸함 (G2)
# 씨네21 · 네오룩 · MMCA · 아트맵 · VMSPACE · KOPIS · 채널예스 · 넷플릭스 뉴스룸
#                 : 404 또는 entries 0 — 사다리 1·2칸이 비어 있음 (3강)
# culture.go.kr 구 openapi        : HTML 에러페이지, 폐기됨 (진짜 키로도 동일)
# api.kcisa.kr API_CCA_1xx        : data.go.kr 키를 받지 않음 (전부 403)
# 한국문화정보원_전시회정보(odcloud) : 2024년 전시 36건짜리 정지된 스냅샷.
#                                   진행 중 0건 · 링크 없음 · 장소 없음 (G1·G2 탈락)

# ── 2026-09-15 추가 실측 — 국내 비중을 늘리려고 후보 70여 곳을 쟀다 ──
# 관문은 넘었지만 '무엇을 싣는가' 가 달라 뺀 것들 (G1~G3 와 다른 축이다):
#   CJ뉴스룸      : 본문 1504자로 통과하나 그룹 보도자료 — 협력사 대금·CGV 라인업.
#                   당사자 발표(tier1)라 tier1_max: 0 의 취지에 정면으로 걸린다
#   연합 문화      : 120건으로 물량 최다이나 공모·출범·수상·홍보 위주. 상한을 다 먹는다
#   맥스무비       : 선필터 60% 통과하나 통과분이 부고·박스오피스·예능
#   익스트림무비    : 캐스팅 확정·촬영 시작 — audience.yaml 의 버릴_것 정면 위배
#   디에디트       : 가전·신상 리스트·쇼핑
#   보그 · GQ · 마리끌레르 : 패션·뷰티·브랜드 협찬
#   국민 문화      : 관광 할인·행정 인사
# 관문에서 떨어진 것들:
#   조선 문화      : 100건 중 94건이 창 안인데 본문 추출 0자 (G1) — Dezeen 과 같은 유형
#   세계 문화 · 한겨레21 · 시사IN : 항목은 있으나 날짜가 전량 없음 (G2)
#   기획회의 · 스트리트H · 헤이팝 : 7일 내 0건 (G2)
#   아트인컬처 · 아트바바 · 디자인정글 · 더뮤지컬 · 플레이디비 · 아르코 · KMDb
#   · 노컷 문화 · 한국일보 문화 · 채널예스 · 알라딘서재 · 중앙 문화 · 엘르 · 에스콰이어
#   · 톱클래스 · 예술경영 · 뉴스페이퍼 · 아트렉처 : 404 또는 entries 0 (G3)
#   인디포스트 · 서울문화재단 : 403 (G3)
#   퍼블릭아트 · 북즐라이프 · 행복이가득한집 · 럭셔리 · 플레이디비 : 접속 불가 (G3)
#
# ── 2026-09-15 문화(영화·책·OTT) 국내 소스 탐색 — 40여 곳 추가 실측 ──
# 결론: 국내에는 문화 전문지 중 쓸 만한 RSS 가 거의 없다. 책에서 한 곳(독서신문)만 건졌다.
# 관문은 넘었으나 싣는 내용이 달라 뺀 것:
#   매경 문화     : 연예 가십 100% (사기 사건·배우 사생활·아이돌)
#   뉴시스 문화    : 통신사 행정·행사 보도 (위령제·혈세 낭비 감사)
#   한경 라이프    : 선필터 통과 5/50 (10%) 인데 통과분이 전부 미술·전시 —
#                  문화가 아니라 공간이다. 45건을 헛수집한다
#   아이즈(ize)   : 캐스팅·복귀·소속사 이적·시청률·박스오피스 — 버릴_것 정면
#   동아 연예 · 오마이스타 : 가요·아이돌·스포츠
#   어라운드      : 감성 에세이 — 볼 것도 갈 곳도 알려주지 않는다
#   미디어오늘     : 언론 비평
#   알라딘 신간    : 수험서·기술서 목록. 큐레이션이 없어 '고른 것' 이 아니다
#   인디스페이스    : 창 안 4건이고 절반이 '상영시간표'. 극장 자체 공지라 tier1 성격
# 관문에서 떨어진 것:
#   씨네21        : 모든 경로에서 bozo — RSS 를 사실상 닫았다 (G3)
#   민음사 · 동아 책 · 한국독립영화협회 : 7일 내 0~1건 (G2)
#   문학동네 · 북DB · 텐아시아 : bozo (G3) · 문장웹진 500 (G3)
#   채널예스(403/404) · 인디스페이스 외 40여 곳 404 — 경향/한겨레 책·영화 섹션,
#   한국일보·중앙·서울경제·아주경제 문화, 씨네랩, 영진위, 한국영상자료원,
#   인디그라운드, 빅이슈, 한국출판진흥원, 예스24 블로그 (G3)
#   교보 북뉴스 · 창비 · 출판저널 · 리버스 · 무비오브무비 · OTT뉴스 : 접속 불가 (G3)

# ── 국내 OTT 플랫폼 — 전부 RSS 가 없다 ──
# 넷플릭스 뉴스룸(ko·en) 404 · 티빙 404 · 웨이브 entries 0 · 키노라이츠 접속 불가
# · 왓챠 블로그 접속 불가. 사다리 1·2칸이 통째로 비어 있다.
# 설령 있었더라도 플랫폼 공식 발표는 tier1(당사자 발표) = 홍보물이라 tier1_max: 0 이 막는다.
# 넷플릭스 신작 정보는 이미 WhatsOnNetflix(2칸 매체)로 들어오고 있고,
# 그 소스의 발행 기여는 13회 동안 0건이다 — 신작 공지는 '이미 화제인 것'
# 이거나 '아직 볼 수 없는 것' 이라 중요도 기준 1·3번에서 떨어진다.
