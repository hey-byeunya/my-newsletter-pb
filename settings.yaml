# settings.yaml — 개발자가 고치는 임계값과 소스 목록.
# audience.yaml 과 나눈 이유: 바뀌는 값이긴 하지만 고치는 사람이 다르다. (섹션 13)

hours:          24     # 수집 시간 창
batch:          40     # 예선 묶음 크기 — 모델이 흘리지 않고 볼 수 있는 크기
prelim_keep:     8     # 묶음당 예선 통과 수 — '묶음 운'을 줄이려고 넉넉히
target:          5     # 최종 발행 목표
tier1_max:       2     # 1차 소스 경쟁 면제의 상한 — 면제만으로 자리가 다 차면 안 된다
per_source_max:  8     # 한 매체가 후보를 독차지하지 못하게
min_body:      600     # G1 본문 관문 기준선(자)
model: "gpt-4o-mini"

# tier 1 = 당사자 발표(경쟁 면제), 2 = 매체
# kind rss = 사다리 2칸 / hn = 1칸(공개 API)
sources:
  - {name: "OpenAI 블로그",    url: "https://openai.com/blog/rss.xml",            tier: 1}
  - {name: "DeepMind",        url: "https://deepmind.google/blog/rss.xml",       tier: 1}
  - {name: "Hugging Face",    url: "https://huggingface.co/blog/feed.xml",       tier: 1}
  # Anthropic 블로그은 공개 RSS 가 없다(404) — 사다리 1·2칸이 비어 있는 소스의 실례.
  # 5칸(스크래핑)까지 내려갈 가치가 있는지는 별도 판단이다. 지금은 목록에서 뺀다.
  - {name: "Google AI",       url: "https://blog.google/technology/ai/rss/",     tier: 1}
  - {name: "TechCrunch AI",   url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
  - {name: "The Verge AI",    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"}
  # VentureBeat 는 자동 수집에 429(요청 한도)를 돌려준다 — G3(접근) 관문 탈락.
  - {name: "Ars Technica AI", url: "https://arstechnica.com/ai/feed/"}
  - {name: "MIT Tech Review", url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"}
  - {name: "AI타임스",         url: "https://www.aitimes.com/rss/allArticle.xml"}
  - {name: "전자신문 IT",      url: "https://rss.etnews.com/Section902.xml"}
  - {name: "ZDNet Korea",     url: "https://feeds.feedburner.com/zdkorea"}
  - name: "Hacker News"
    url:  "https://hn.algolia.com/api/v1/search_by_date?tags=story&query=AI&hitsPerPage=50"
    kind: "hn"
