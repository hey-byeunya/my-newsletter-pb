# audience.yaml — 분야가 바뀌면 이 파일만 갈아 끼운다. (섹션 13)
# 이 파일을 고치는 사람은 개발자가 아니라 편집 방향을 정하는 사람이다.

독자:
  누구: "AI를 실제 제품에 붙이는 국내 개발팀 — 개발자와 기획자"
  이미_아는_것: "LLM API 사용법, 프롬프트 기본, RAG 개념"

# 본선 프롬프트에 그대로 들어간다. 위에 있을수록 우선.
# 기사 하나를 보고 예/아니오로 답할 수 있는 질문이어야 한다.
#   ✗ "좋은 기사인가"        — 판정할 수 없어 모델이 매번 다르게 해석한다
#   ○ "가격이 실제로 변했나"  — 답할 수 있다
중요도_기준:
  - "이번 주 우리가 일하는 방식이 바뀔 만한가"
  - "지금 쓰는 도구·API의 가격·한도·정책이 실제로 변했나"
  - "새로 쓸 수 있게 된 것이 오늘 당장 손에 잡히는가"
  - "국내 서비스에 적용될 규제나 제도가 확정됐나"

# 추상어("홍보성") 말고 구체적인 표현으로.
# "홍보성 기사를 버려라"는 모델마다 다르게 해석하지만,
# "MOU·투자유치·수상"은 거의 틀리지 않는다.
버릴_것:
  - "발표 예정·로드맵만 있고 지금 쓸 수 없는 것"
  - "MOU·업무협약·투자유치·수상 등 당사자 홍보성 소식"
  - "벤치마크 점수만 있고 무엇이 달라지는지 없는 것"
  - "인사·조직 개편 등 제품과 무관한 소식"
  - "이미 며칠 전에 알려진 사건의 후속 해설"
  # 아래 둘은 국내 IT 속보 피드를 넣은 뒤 실제로 발행된 기사를 보고 추가했다.
  # 키워드 필터로는 못 거른다 — '수공 물 인프라 수주' 기사에도 'AI 정수장'이 들어 있다.
  - "특정 기업이 AI를 도입·적용·확대했다는 소식. 우리가 쓸 수 있는 도구가 새로 생긴 게 아니면 버린다"
  - "수주·계약·사업 확대·실적 발표. 금액이 커도 우리 작업과 무관하면 버린다"

# 이름은 Draft.topic 에 그대로 들어가고, 색은 디스코드 embed 에 쓰인다.
토픽:
  - 이름: "모델·API"
    데스크지침: "가격·컨텍스트 길이·요청 한도 변화를 반드시 숫자로 적을 것"
    색: 0x0B6E77
  - 이름: "도구·프레임워크"
    데스크지침: "무엇이 새로 가능해졌는지, 기존 코드를 고쳐야 하는지 적을 것"
    색: 0x2563EB
  - 이름: "정책·규제"
    데스크지침: "규제 대상과 시행 시점을 반드시. 국내 적용 여부도"
    색: 0xB45309
  - 이름: "업계·투자"
    데스크지침: "우리 스택에 영향이 있을 때만. 금액만 있는 소식은 버릴 것"
    색: 0x6B7280
