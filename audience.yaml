# audience.yaml — 오늘의 곁눈질 (문화 콘텐츠 + 공간 가이드)
# 이 파일을 고치는 사람은 개발자가 아니라 편집 방향을 정하는 사람이다.

독자:
  누구: "볼 만한 것과 가볼 만한 곳을 찾는 사람 — 화제작보다 덜 알려진 것을 선호"
  이미_아는_것: "교과서 수준의 미술사·문학사는 알지만 지금 무엇이 논의되는지는 모름.
              박스오피스·베스트셀러 상위권과 이미 화제인 작품은 알고 있음"

# 기사 하나를 보고 예/아니오로 답할 수 있는 질문이어야 한다. 위에 있을수록 우선.
# 묶음 이름만 주면 '전시도 문화'로 읽힌다. 가르는 기준을 행동으로 적는다.
묶음설명:
  문화: "집이나 손 안에서 보고 읽는 것. 스트리밍·극장·책"
  공간: "직접 찾아가서 몸으로 겪는 것. 전시장·미술관·공연장·건축물"

중요도_기준:
  - "작품·전시 하나만 다루지 않고, 둘 이상을 견주거나 계보·흐름을 짚는가"
  - "만든 사람·시대·앞선 작품 같은 배경이 본문에 있는가 — 일정과 장소 안내만 있는 글이 아닌가"
  - "사조 이름이나 전문용어가 나올 때 뜻을 함께 풀어 주는가"
  - "덜 알려진 것인가 — 화제작·상위권이 아니라 묻혀 있던 것인가"
  - "왜 볼 만한지 구체적인 근거가 있는가 — 연출·문장·공간에 대한 실제 묘사"
  - "볼 수 있는 방법이 글에 있는가 — 없어도 되지만 있으면 낫다"

# 추상어 말고 구체적으로. ('홍보성' 같은 말은 모델마다 다르게 해석한다)
버릴_것:
  # '아직 못 보는 것' 금지는 풀었다 — 교양에서는 예정작의 맥락도 값이 있다.
  # 대신 맥락 없는 글을 직접 막는다.
  - "줄거리·출품작 목록만 나열하고 해석이나 배경이 없는 것"
  - "보도자료 표현만 있고 쓴 사람의 관찰이 없는 글"
  - "캐스팅·촬영 시작·제작 확정 등 아직 결과물이 없는 소식"
  - "시상식 수상·후보 발표, 흥행 성적, 시청률·판매 순위"
  - "배우·감독·작가의 사생활, 열애, 논란"
  - "이미 화제인 작품의 또 다른 리뷰 — 넷플릭스 주간 1위, 베스트셀러 1위"
  - "굿즈·협업 상품·티켓 할인·이벤트 응모 등 판매 소식"
  - "케이팝 아이돌·예능·가요 순위 등 연예 소식"

# 위 '버릴_것' 중 낱말로 잡히는 것 — 선별이 놓쳐도 발행 직전에 한 번 더 거른다.
# headline 이나 summary 에 이 말이 있으면 발행분에서 뺀다.
#
# 왜 필요한가: 검수는 '원문과 맞는가' 만 본다. 원문에 진짜로 있는 사실이면
# 통과시킨다. 실측으로 '종합베스트셀러 순위에서 1위' 가 그렇게 새어나갔다.
# 선별이 놓치면 막을 층이 없어서, 낱말로 잡히는 것만이라도 코드로 막는다.
#
# 넓게 적으면 멀쩡한 기사가 죽는다. 거의 언제나 버릴_것 인 말만 적을 것.
# 실측(후보 21건 + 과거 발행 13건): 시상식 3건 전부 검출 · 오검출 0.
버릴_낱말:
  - "베스트셀러 1위"
  - "베스트셀러 순위"
  - "박스오피스 1위"
  - "주간 1위"
  - "시청률 1위"
  - "3관왕"
  - "수상작 발표"
  - "후보 발표"
  - "emmy award"
  - "box office"
  - "bestseller list"
  - "winners revealed"

# 묶음은 쿼터의 단위다 (settings.yaml 의 quota 와 이름이 맞아야 한다).
# 데스크지침에 '반드시 적을 것' 을 쓰면, 원문에 없을 때 모델이 지어낸다.
# 실제로 '러닝타임을 적을 것' 때문에 없는 100분을 만들어 검수에서 탈락했다.
토픽:
  - 이름: "OTT·시리즈"
    묶음: "문화"
    데스크지침: "어느 플랫폼에서 볼 수 있는지와 몇 부작인지를 원문에 있으면 적을 것. 없으면 쓰지 말 것"
    색: 0xB5179E
  - 이름: "영화"
    묶음: "문화"
    데스크지침: "어디서 볼 수 있는지(극장·스트리밍)를 원문에 있는 대로. 상영 시간·개봉일 같은 숫자는 원문에 그대로 적힌 것만 쓸 것"
    색: 0x7209B7
  - 이름: "책"
    묶음: "문화"
    데스크지침: "국내 번역본 여부는 원문에 있을 때만 적을 것. 어떤 독자에게 맞는지는 요약 내용에 근거해 한 줄로"
    색: 0x3A0CA3
  - 이름: "전시·공간"
    묶음: "공간"
    데스크지침: "이 전시가 무엇을 묻는지 먼저 쓸 것. 기간·장소는 원문에 있으면 끝에 한 줄로"
    색: 0x0B6E77
  - 이름: "건축·디자인"
    묶음: "공간"
    데스크지침: "무엇을 해결하려 한 설계인지 먼저. 어디에 있는 무엇인지는 원문에 있는 대로 덧붙일 것"
    색: 0x2A9D8F
  # 공연은 '직접 가서 겪는 것' 이라 전시와 같은 묶음이다.
  # 프로그램 구성·출연진은 보도자료에만 있고 기사에는 없는 경우가 많다.
  # 실제로 한 축제 기사에서 '야간 답사'와 '능침 특별 개방'을 지어내 검수에서 탈락했다.
  # 그래서 '반드시' 대신 '원문에 적힌 것만' 으로 쓴다.
  - 이름: "공연"
    묶음: "공간"
    데스크지침: "공연 날짜와 공연장을 원문에 있는 대로. 출연자·지휘자·프로그램 구성은 원문에 적힌 것만 쓸 것. 없으면 쓰지 말 것"
    색: 0x57CC99

# ── 발행 화면에 찍히는 말 ────────────────────────────────
# 디스코드에서 이렇게 보인다:
#   오늘의 곁눈질                     ← 보내는이
#   ┌──────────────────────────────
#   │ 2026년 09월 15일  ·  볼 것 2 · 갈 곳 3    ← 제목
#   │ 오늘의 픽!                                ← 설명
#
# {날짜}·{배분}·{건수} 를 쓸 수 있다. 배분은 묶음표시로 만든다.
# 0건인 묶음은 배분에서 빠진다 — '볼 것 0' 은 읽는 사람에게 소용이 없다.
발행:
  보내는이: "오늘의 곁눈질"
  제목:     "{날짜}  ·  {배분}"
  설명:     "오늘의 픽!"
  날짜형식: "%Y년 %m월 %d일"

  # 묶음 이름은 쿼터가 쓰는 말이고, 독자에게 보일 말은 따로 정한다.
  # 여기 적은 순서대로 제목에 들어간다.
  묶음표시:
    문화: "볼 것"
    공간: "갈 곳"

  # 0건인 날에도 보낸다 — 아무것도 안 보내면 파이프라인이 죽은 것과 구분이 안 된다.
  조용한날:
    제목: "{날짜}"
    설명: "오늘은 건질 게 없었습니다."
